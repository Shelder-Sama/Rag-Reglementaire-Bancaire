name: Deploiement vers Google Cloud Run

# 1. Quand est-ce que ce robot s'active ?
# Ici, à chaque fois que tu feras un "push" (une mise à jour) sur la branche principale (main)
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 2. Le robot télécharge ton code depuis GitHub
    - name: Checkout du code
      uses: actions/checkout@v3

    # 3. Il se connecte à ton compte Google Cloud (via des mots de passe sécurisés)
    - name: Authentification Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

    # 4. Il configure l'outil Google Cloud
    - name: Configuration de Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: '${{ secrets.GCP_PROJECT_ID }}'

    # 5. Il construit l'image Docker et l'envoie sur le registre de Google (Artifact Registry)
    - name: Build et Push de l'image Docker
      run: |
        gcloud auth configure-docker europe-west1-docker.pkg.dev
        docker build -t europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/mon-repo-rag/api-rag:latest .
        docker push europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/mon-repo-rag/api-rag:latest

    # 6. Il déploie la nouvelle version sur Cloud Run pour la rendre accessible sur internet
    - name: Déploiement sur Cloud Run
      uses: google-github-actions/deploy-cloudrun@v1
      with:
        service: api-rag-bce
        image: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/mon-repo-rag/api-rag:latest
        region: europe-west1
        flags: '--allow-unauthenticated --memory=2Gi --cpu=2 --timeout=600'